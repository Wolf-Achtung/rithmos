# Local infrastructure for Rithmos. Phase 3 adds the API service.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rithmos}
      POSTGRES_USER: ${POSTGRES_USER:-rithmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rithmos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
