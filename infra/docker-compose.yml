# Local infrastructure for Rithmos: PostgreSQL and the API.
# Copy .env.example to .env in this directory first.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rithmos}
      POSTGRES_USER: ${POSTGRES_USER:-rithmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rithmos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rithmos}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      # same image Railway builds: repository root as context, Dockerfile there
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rithmos}:${POSTGRES_PASSWORD:-rithmos}@db:5432/${POSTGRES_DB:-rithmos}
      RITHMOS_JOBS_TOKEN: ${RITHMOS_JOBS_TOKEN:-}
      RITHMOS_CORS_ORIGINS: ${RITHMOS_CORS_ORIGINS:-}
      PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  dbdata:
