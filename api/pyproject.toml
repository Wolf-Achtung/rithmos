[project]
name = "rithmos-api"
version = "0.1.0"
description = "Rithmos API: accounts, coverage sync, daily Middles puzzles"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
